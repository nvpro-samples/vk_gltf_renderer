<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9822b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b6fd9"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">Who counts what: the three kinds of receiver</text>
  <g transform="translate(20,0)">
  <rect x="0" y="44" width="280" height="380" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="14" y="70" fill="#222" font-size="15" font-weight="bold" text-anchor="start">A  Seen directly</text>
  <rect x="10" y="330" width="260" height="10" fill="#bbb"/>
  <circle cx="40" cy="110" r="9" fill="#ffd54a" stroke="#c9a200"/>
  </g>
  <g transform="translate(340,0)">
  <rect x="0" y="44" width="280" height="380" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="14" y="70" fill="#222" font-size="15" font-weight="bold" text-anchor="start">B  Seen through glass</text>
  <rect x="10" y="330" width="260" height="10" fill="#bbb"/>
  <circle cx="40" cy="110" r="9" fill="#ffd54a" stroke="#c9a200"/>
  </g>
  <g transform="translate(660,0)">
  <rect x="0" y="44" width="280" height="380" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
  <text x="14" y="70" fill="#222" font-size="15" font-weight="bold" text-anchor="start">C  Lit by a bounce</text>
  <rect x="10" y="330" width="260" height="10" fill="#bbb"/>
  <circle cx="40" cy="110" r="9" fill="#ffd54a" stroke="#c9a200"/>
  </g>
  <g transform="translate(20,0)">
  <circle cx="110" cy="295" r="34" fill="#cfe8ff" fill-opacity="0.7" stroke="#4a90c8" stroke-width="2"/>
  <rect x="190" y="90" width="60" height="26" rx="6" fill="#e8e8e8" stroke="#666"/>
  <text x="220.0" y="108.0" fill="#222" font-size="13" text-anchor="middle">camera</text>
  <path d="M42 118 L90 272 L130 318 L190 330" stroke="#d9822b" stroke-width="2" fill="none" marker-end="url(#o)"/>
  <circle cx="190" cy="330" r="5" fill="#d9822b"/>
  <path d="M200 322 L222 120" stroke="#2b6fd9" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="14" y="372" fill="#a55a10" font-size="12" text-anchor="start">splat: the photon is connected to the</text>
  <text x="14" y="388" fill="#a55a10" font-size="12" text-anchor="start">camera and lights the pixel it projects to</text>
  <text x="14" y="410" fill="#555" font-size="12" text-anchor="start">one pixel per photon: sharp, no radius</text>
  </g>
  <g transform="translate(340,0)">
  <circle cx="130" cy="295" r="34" fill="#cfe8ff" fill-opacity="0.7" stroke="#4a90c8" stroke-width="2"/>
  <rect x="190" y="90" width="60" height="26" rx="6" fill="#e8e8e8" stroke="#666"/>
  <text x="220.0" y="108.0" fill="#222" font-size="13" text-anchor="middle">camera</text>
  <path d="M42 118 L112 274 L150 318 L180 330" stroke="#d9822b" stroke-width="2" fill="none" marker-end="url(#o)"/>
  <path d="M205 118 L150 262 L135 300 L170 330" stroke="#2b6fd9" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <circle cx="180" cy="330" r="5" fill="#d9822b"/>
  <circle cx="178" cy="330" r="22" fill="none" stroke="#d9822b" stroke-dasharray="3 3"/>
  <text x="14" y="372" fill="#a55a10" font-size="12" text-anchor="start">gather: sum the photons landed around D</text>
  <text x="14" y="388" fill="#a55a10" font-size="12" text-anchor="start">in a small disk, weighted by distance</text>
  <text x="14" y="410" fill="#555" font-size="12" text-anchor="start">the glass is between the camera and D</text>
  </g>
  <g transform="translate(660,0)">
  <rect x="262" y="140" width="10" height="190" fill="#bbb"/>
  <circle cx="110" cy="295" r="34" fill="#cfe8ff" fill-opacity="0.7" stroke="#4a90c8" stroke-width="2"/>
  <rect x="190" y="90" width="60" height="26" rx="6" fill="#e8e8e8" stroke="#666"/>
  <text x="220.0" y="108.0" fill="#222" font-size="13" text-anchor="middle">camera</text>
  <path d="M215 118 L200 326" stroke="#2b6fd9" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M200 330 L262 215" stroke="#2b6fd9" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M42 118 L90 272 L130 318 L180 296 L262 215" stroke="#d9822b" stroke-width="2" fill="none" stroke-opacity="0.9" marker-end="url(#o)"/>
  <circle cx="262" cy="215" r="5" fill="#d9822b"/>
  <circle cx="200" cy="330" r="4" fill="#2b6fd9"/>
  <circle cx="262" cy="215" r="20" fill="none" stroke="#d9822b" stroke-dasharray="3 3"/>
  <text x="14" y="372" fill="#a55a10" font-size="12" text-anchor="start">the floor is covered by splats; the</text>
  <text x="14" y="388" fill="#a55a10" font-size="12" text-anchor="start">wall it bounces to is the next receiver</text>
  <text x="14" y="410" fill="#555" font-size="12" text-anchor="start">gather at each receiver of a path (a few)</text>
  </g>
  <rect x="20" y="440" width="920" height="46" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="34" y="460" fill="#2e7d32" font-size="14" font-weight="bold" text-anchor="start">Everything else is the path tracer, as before.</text>
  <text x="34" y="478" fill="#333" font-size="12" text-anchor="start">At a covered receiver its light samples treat casters as opaque and a ray that leaves through casters and finds a light adds nothing: the photons already carry that light.</text>
</svg>
