# UI inspection script — drives the windowed app and captures the full window
# (ImGui panels + viewport) so scene-list / Inspector changes can be reviewed.
#
# Run WITHOUT --benchmark so the side panels stay visible; the sequencer still
# steps the script and closes the app when it finishes:
#
#   vk_gltf_renderer --sequencefile utils/benchmark/ui_inspect.cfg \
#                    --scenefile shader_ball.gltf --hdrfile std_env.hdr
#
# --uiScreenshot captures the composited swapchain (panels included), unlike
# --screenshot which saves the viewport render only. --selectNode takes a glTF
# node index (as listed in the Scene Browser tree) and drives the Inspector
# contents and the Scene Browser highlight.
#
# Relative --uiScreenshot paths (e.g. "ui_overview.png" below) are resolved
# relative to THIS sequence file's directory (utils/benchmark/), not the working
# directory. Use an absolute path to place captures elsewhere.
#
# IMPORTANT ordering rule: put a UI action (e.g. --selectNode) in one SEQUENCE
# and the matching --uiScreenshot in the NEXT SEQUENCE. The screenshot is
# captured a couple of frames after the parameters apply; giving it its own
# sequence guarantees the selection has propagated (selection -> Scene Browser
# -> Inspector) before the capture. Also give "load" enough frames for the
# scene and ray-query pipeline to finish (async in a non-benchmark run).

SEQUENCE "load"
--sequenceframes 240
--envSystem 1

SEQUENCE "overview action"
--sequenceframes 20

SEQUENCE "overview capture"
--sequenceframes 10
--uiScreenshot ui_overview.png

SEQUENCE "select node 1"
--sequenceframes 20
--selectNode 1

SEQUENCE "select node 1 capture"
--sequenceframes 10
--uiScreenshot ui_node1.png
